<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>Quadro de hábitos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ceu:#FF4F93;          /* rosa vibrante — hero e destaques */
    --ceu-esc:#C2185B;      /* rosa profundo — botões, banners e blocos sólidos */
    --marinho:#17120F;      /* preto quente — texto e a logo */
    --marinho-cl:#D6247A;
    --gelo:#FAD6E7;         /* fundo da página — rosa saturado */
    --branco:#FFF6FA;       /* superfície dos painéis — branco rosado */
    --poco:#FCDCEC;         /* superfície secundária (inputs, caixas) */
    --linha:#F0C3DA;
    --cinza:#B07690;
    --azul:#22A366;         /* concluí — verde */
    --verde:#2563EB;        /* comecei — azul */
    --vermelho:#E8543A;     /* não fiz */
    --vazio:#F5C6DB;
    --tracejado:#EAA9C7;
    --f:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--gelo);color-scheme:light}
  body{font-family:var(--f);color:var(--marinho);font-size:15px;line-height:1.5;padding:0 0 82px;min-height:100vh;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:0 12px}
  button{font-family:var(--f);cursor:pointer;color:var(--marinho)}
  .hidden{display:none!important}

  /* ---------- hero ---------- */
  .hero{
    position:relative;overflow:hidden;background:var(--ceu);
    border-radius:0 0 34px 34px;padding:16px 20px 26px;margin-bottom:14px;
  }
  .hero::before{ /* círculo branco atrás do título */
    content:"";position:absolute;right:-40px;top:-30px;width:190px;height:190px;
    border-radius:50%;background:rgba(255,255,255,.22);
  }
  .hero::after{ /* pontinhos */
    content:"";position:absolute;right:14px;bottom:14px;width:96px;height:56px;
    background-image:radial-gradient(rgba(255,255,255,.55) 2.2px, transparent 2.3px);
    background-size:14px 14px;
  }
  .brand{display:flex;align-items:center;gap:9px;position:relative;z-index:1;margin-bottom:16px}
  .mark{width:28px;height:28px;background:var(--marinho);border-radius:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:5px;flex:0 0 auto}
  .mark i{border-radius:1px;background:rgba(255,255,255,.35)}
  .mark i:nth-child(1),.mark i:nth-child(5),.mark i:nth-child(6),.mark i:nth-child(7){background:#fff}
  .mark i:nth-child(2),.mark i:nth-child(9){background:#7FE3C4}
  .mark i:nth-child(4){background:var(--vermelho)}
  .brand b{font-weight:800;font-size:15px;color:#fff;flex:1;letter-spacing:-.01em}
  .mini{background:rgba(255,255,255,.25);color:#fff;font-weight:800;font-size:12px;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .pill{
    display:inline-block;background:#fff;color:var(--ceu);font-weight:800;font-size:11px;
    letter-spacing:.06em;text-transform:uppercase;padding:5px 13px;border-radius:999px;
    position:relative;z-index:1;margin-bottom:8px;
  }
  h1{
    font-weight:900;font-size:34px;line-height:.98;letter-spacing:-.035em;
    color:var(--marinho);margin:0;position:relative;z-index:1;max-width:72%;
  }

  /* ---------- blocos ---------- */
  .panel{background:var(--branco);border-radius:22px;overflow:hidden;box-shadow:0 1px 0 rgba(23,18,15,.06)}
  .panel+.panel{margin-top:12px}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px}
  .panel-title{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--cinza)}
  .link{background:none;border:none;padding:0;color:var(--ceu);font-weight:800;font-size:12px}

  /* ---------- hoje ---------- */
  .dayline{background:var(--ceu-esc);color:#FCE3EC;border-radius:20px;padding:15px 16px;margin-bottom:12px;font-size:13.5px;line-height:1.55;font-weight:600}
  .dayline b{color:#fff;font-weight:900}
  .hcard{background:var(--branco);border-radius:22px;padding:16px;margin-bottom:12px}
  .hcard.feito{background:linear-gradient(180deg,#FFE3ED 0%,var(--branco) 60%)}
  .hcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:13px}
  .hname{font-weight:900;font-size:19px;margin:0;letter-spacing:-.02em;line-height:1.15}
  .hcue{font-size:12.5px;color:var(--cinza);margin:3px 0 0;font-weight:600}
  .streak{font-size:11px;font-weight:800;color:var(--cinza);white-space:nowrap;background:var(--poco);padding:5px 10px;border-radius:999px}
  .streak.on{color:#fff;background:var(--ceu)}
  .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .ch{
    border:2px solid transparent;background:transparent;border-radius:14px;padding:11px 4px;
    font-size:12.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px;
    color:var(--cinza);touch-action:manipulation;
    transition:transform .12s ease,background-color .18s ease,border-color .18s ease;
  }
  .ch i{width:15px;height:15px;border-radius:5px;background:var(--vazio);display:block;transition:transform .12s ease}
  .ch[data-v=done] i{background:var(--azul)}
  .ch[data-v=started] i{background:var(--verde)}
  .ch[data-v=missed] i{background:var(--vermelho)}
  .ch:active{transform:scale(.92)}
  .ch:active i{transform:scale(1.25)}
  .ch[data-v=done]:active{background:rgba(34,163,102,.14)}
  .ch[data-v=started]:active{background:rgba(37,99,235,.14)}
  .ch[data-v=missed]:active{background:rgba(232,84,58,.14)}
  .ch[data-v=done][aria-pressed=true]{border-color:var(--azul);background:var(--azul);color:#fff}
  .ch[data-v=started][aria-pressed=true]{border-color:var(--verde);background:var(--verde);color:#fff}
  .ch[data-v=missed][aria-pressed=true]{border-color:var(--vermelho);background:var(--vermelho);color:#fff}
  .ch[aria-pressed=true] i{background:#fff}
  .ch:focus-visible{outline:2px solid var(--ceu);outline-offset:2px}
  .weekstrip{display:flex;gap:5px;margin-top:13px}
  .ws{flex:1;text-align:center}
  .ws span{font-size:10px;font-weight:800;color:var(--cinza);display:block;margin-bottom:4px}
  .ws i{display:block;height:6px;border-radius:999px;background:var(--vazio)}
  .ws i.done{background:var(--azul)} .ws i.started{background:var(--verde)} .ws i.missed{background:var(--vermelho)}
  .ws.now i{box-shadow:0 0 0 2px var(--ceu)}

  /* ---------- mês ---------- */
  .monthbar{display:flex;align-items:center;gap:10px;background:var(--branco);border-radius:999px;padding:7px 9px;margin-bottom:12px}
  .monthbar .label{flex:1;text-align:center;font-weight:900;font-size:16px;text-transform:capitalize;letter-spacing:-.02em}
  .nav{background:var(--poco);border:none;border-radius:50%;width:34px;height:34px;font-size:17px;line-height:1;font-weight:800;color:var(--marinho)}
  .nav:active{background:var(--ceu);color:#fff}
  .scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .grid{display:grid;width:max-content;min-width:100%}
  .cellname,.dayhead,.cell,.corner{border-bottom:1px solid var(--linha)}
  .corner,.cellname{position:sticky;left:0;z-index:2;background:var(--branco);border-right:1px solid var(--linha);padding:0 12px;width:126px}
  .corner{height:40px;display:flex;align-items:center}
  .cellname{height:44px;font-size:13px;font-weight:800;line-height:44px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .dayhead{height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;width:34px;font-size:10px;font-weight:700;color:var(--cinza)}
  .dayhead b{font-size:12px;font-weight:800;color:var(--marinho)}
  .dayhead.weekend,.cell.weekend{background:var(--poco)}
  .dayhead.today{background:var(--ceu)}
  .dayhead.today b,.dayhead.today span{color:#fff}
  .cell{width:34px;height:44px;display:flex;align-items:center;justify-content:center;border-left:none;border-right:none;border-top:none;padding:0;background:none}
  .dot{width:22px;height:22px;border-radius:7px;background:var(--vazio);display:block}
  .cell[data-s=done] .dot{background:var(--azul)}
  .cell[data-s=started] .dot{background:var(--verde)}
  .cell[data-s=missed] .dot{background:var(--vermelho)}
  .cell[data-s=none] .dot{background:transparent;border:2px dashed var(--tracejado)}
  .cell.future .dot{opacity:.35}
  .cell:focus-visible{outline:2px solid var(--ceu);outline-offset:-2px}
  .legend{display:flex;flex-wrap:wrap;gap:10px;padding:14px 16px}
  .legend span{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--cinza)}
  .chip{width:13px;height:13px;border-radius:5px;display:block}

  /* ---------- editor ---------- */
  .hrow{display:flex;gap:7px;align-items:center;padding:9px 16px;border-top:1px solid var(--linha)}
  .hrow input{font-family:var(--f);font-size:13px;font-weight:700;padding:10px 12px;border:1px solid var(--linha);border-radius:12px;background:var(--poco);color:var(--marinho);min-width:0}
  .hrow .n1{flex:1.1} .hrow .n2{flex:1;font-weight:600}
  .hrow input:focus{outline:2px solid var(--ceu);outline-offset:-1px}
  .del{background:var(--poco);border:1px solid var(--linha);border-radius:12px;min-width:38px;height:38px;padding:0 10px;color:var(--cinza);flex:0 0 auto;white-space:nowrap;font-weight:800;font-size:14px}
  .del.armado{border-color:var(--vermelho);background:var(--vermelho);color:#fff;font-size:12px}
  .form{padding:14px 16px 16px;border-top:1px solid var(--linha);display:flex;gap:7px;flex-wrap:wrap}
  .form input{flex:1;min-width:112px;font-family:var(--f);font-size:14px;font-weight:600;padding:12px;border:1px solid var(--linha);border-radius:14px;background:var(--poco);color:var(--marinho)}
  .form input:focus{outline:2px solid var(--ceu);outline-offset:-1px}
  .btn{background:var(--ceu-esc);color:#fff;border:none;border-radius:999px;padding:12px 20px;font-weight:800;font-size:14px}
  .btn:active{background:var(--marinho-cl)}
  .btn.ghost{background:#fff;color:var(--marinho);border:2px solid var(--linha)}
  .btn.wide{width:100%;margin-top:4px;padding:15px}
  .empty{padding:26px 18px;text-align:center;color:var(--cinza);font-size:13.5px;font-weight:600}
  .empty b{display:block;color:var(--marinho);font-size:19px;font-weight:900;margin-bottom:6px;letter-spacing:-.02em}
  .seeds{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:14px}
  .seed{background:var(--gelo);border:none;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:800;color:var(--marinho)}

  /* ---------- relatório ---------- */
  .rcard{background:var(--branco);border-radius:22px;padding:18px 16px;margin-bottom:12px}
  .rname{font-weight:900;font-size:19px;margin:0 0 12px;letter-spacing:-.02em}
  .ribbon{display:flex;gap:2px;height:30px;margin-bottom:14px}
  .rb{flex:1;background:var(--vazio);border-radius:3px}
  .rb.done{background:var(--azul)} .rb.started{background:var(--verde)} .rb.missed{background:var(--vermelho)}
  .rb.gap{flex:0 0 4px;background:none}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .st{background:var(--poco);border-radius:14px;padding:11px 4px;text-align:center}
  .st .n{font-weight:900;font-size:21px;line-height:1.05;letter-spacing:-.03em}
  .st .l{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--cinza);margin-top:3px}
  .st.a .n{color:var(--azul)} .st.v .n{color:var(--verde)} .st.r .n{color:var(--vermelho)}
  .st.p{background:var(--ceu-esc)} .st.p .n{color:#fff} .st.p .l{color:#F9C7DE}
  .rnote{font-size:12.5px;color:var(--cinza);margin:14px 0 0;line-height:1.65;font-weight:600}
  .rnote b{color:var(--marinho);font-weight:800}
  .summary{position:relative;overflow:hidden;background:var(--ceu);border-radius:22px;padding:20px 18px;margin-bottom:12px}
  .summary::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.2)}
  .summary h2{font-size:24px;margin:0 0 2px;font-weight:900;text-transform:capitalize;letter-spacing:-.03em;color:var(--marinho);position:relative;z-index:1}
  .summary .sub{font-size:11px;color:#fff;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px;position:relative;z-index:1}
  .summary p{font-size:13.5px;line-height:1.6;margin:0 0 9px;color:var(--marinho);font-weight:600;position:relative;z-index:1}
  .summary p:last-child{margin-bottom:0}
  .summary b{color:#fff;font-weight:900}

  /* ---------- abas ---------- */
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--branco);border-top:1px solid var(--linha);display:grid;grid-template-columns:repeat(4,1fr);box-shadow:0 -2px 14px rgba(23,18,15,.06)}
  .tab{background:none;border:none;padding:10px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--cinza);font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
  .tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .tab[aria-selected=true]{color:var(--marinho)}
  .tab[aria-selected=true] svg{stroke:var(--ceu)}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;background:var(--ceu-esc);color:#fff;padding:12px 18px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
  .toast.on{opacity:1}

  /* planejamento */
  .plano-top{display:flex;align-items:center;gap:10px;background:var(--branco);border-radius:999px;padding:7px 9px;margin-bottom:12px}
  .plano-top .label{flex:1;text-align:center;font-weight:900;font-size:15px;letter-spacing:-.02em;text-transform:capitalize}
  .barra{height:8px;border-radius:999px;background:var(--vazio);overflow:hidden;margin:0 0 14px}
  .barra i{display:block;height:100%;background:var(--azul);border-radius:999px;transition:width .3s ease}
  .tarefa{display:flex;align-items:flex-start;gap:11px;padding:13px 16px;border-top:1px solid var(--linha);touch-action:manipulation}
  .tarefa:first-child{border-top:none}
  .tcheck{flex:0 0 auto;width:26px;height:26px;border-radius:9px;border:2px solid var(--linha);background:#fff;display:flex;align-items:center;justify-content:center;padding:0;transition:transform .12s ease,background-color .18s ease,border-color .18s ease}
  .tcheck:active{transform:scale(.88)}
  .tcheck svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .15s ease}
  .tarefa.ok .tcheck{background:var(--azul);border-color:var(--azul)}
  .tarefa.ok .tcheck svg{opacity:1}
  .ttxt{flex:1;font-size:15px;font-weight:700;line-height:1.35;padding-top:3px;word-break:break-word}
  .tarefa.ok .ttxt{color:var(--cinza);text-decoration:line-through;text-decoration-thickness:2px}
  .tdel{flex:0 0 auto;background:none;border:none;color:#D9AFC0;font-size:17px;font-weight:800;padding:2px 4px;line-height:1}
  .tdel:active{color:var(--vermelho);transform:scale(.9)}
  .plano-resumo{background:var(--ceu-esc);color:#FCE3EC;border-radius:20px;padding:15px 16px;margin-bottom:12px;font-size:13.5px;line-height:1.55;font-weight:600}
  .plano-resumo b{color:#fff;font-weight:900}
  .puxar{width:100%;background:var(--poco);border:1px dashed var(--tracejado);border-radius:14px;padding:12px;font-size:13px;font-weight:800;color:var(--marinho);margin-top:10px}
  .puxar:active{transform:scale(.97)}


  .motivo{margin-top:12px;padding-top:12px;border-top:1px dashed var(--linha)}
  .motivo-l{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--cinza);margin:0 0 8px}
  .motivos{display:flex;gap:7px;flex-wrap:wrap}
  .mt{border:none;background:var(--poco);color:var(--cinza);border-radius:999px;padding:9px 14px;font-size:12.5px;font-weight:800;touch-action:manipulation;transition:transform .12s ease,background-color .18s ease,color .18s ease}
  .mt:active{transform:scale(.94)}
  .mt[aria-pressed=true]{background:var(--vermelho);color:#fff}

  /* arquivados */
  .arq-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--linha);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--cinza);background:var(--poco)}
  .arq-row{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--linha);background:var(--poco)}
  .arq-row span{flex:1;font-weight:700;font-size:13.5px;color:var(--cinza);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mini-btn{border:1px solid var(--linha);background:#fff;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:800;color:var(--marinho);white-space:nowrap}
  .mini-btn.perigo{color:var(--vermelho);border-color:#F6C9C0}
  .mini-btn.armado{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
  .arq-btn{background:var(--poco);border:1px solid var(--linha);border-radius:12px;min-width:38px;height:38px;padding:0 12px;color:var(--cinza);flex:0 0 auto;white-space:nowrap;font-weight:800;font-size:12px}

  /* dados */
  .dados-txt{width:100%;min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:11px;padding:12px;border:1px solid var(--linha);border-radius:14px;background:var(--poco);color:var(--marinho);resize:vertical}
  .dados-txt:focus{outline:2px solid var(--ceu);outline-offset:-1px}
  .dados-box{padding:0 16px 16px;display:flex;flex-direction:column;gap:8px}
  .dados-row{display:flex;gap:8px;flex-wrap:wrap}
  .dados-row .btn{flex:1;min-width:120px;padding:12px 14px;font-size:13px}
  .aviso{font-size:12px;font-weight:600;color:var(--cinza);line-height:1.55;margin:0}


  button{touch-action:manipulation;transition:transform .12s ease,background-color .18s ease,color .18s ease}
  .btn:active,.seed:active,.del:active,.link:active{transform:scale(.96)}
  .nav:active{transform:scale(.9)}
  .tab:active{transform:scale(.94)}
  .cell{transition:transform .1s ease}
  .cell:active{transform:scale(.86)}
  .dot{transition:background-color .15s ease,border-color .15s ease}
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important}
    .ch:active,.ch:active i,.btn:active,.seed:active,.del:active,.link:active,
    .nav:active,.tab:active,.cell:active{transform:none!important}
  }
</style>
</head>
<body>

<header class="hero">
  <div class="brand">
    <div class="mark"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <b>Quadro de hábitos</b>
    <span class="mini" id="miniStat"></span>
  </div>
  <span class="pill" id="heroPill">Hoje</span>
  <h1 id="heroTitle">—</h1>
</header>

<div class="wrap">
  <section id="view-hoje">
    <div id="dayline"></div>
    <div id="todayList"></div>
  </section>

  <section id="view-mes" class="hidden">
    <div class="monthbar">
      <button class="nav" id="prev" aria-label="Mês anterior">‹</button>
      <div class="label" id="monthLabel">—</div>
      <button class="nav" id="next" aria-label="Próximo mês">›</button>
    </div>
    <section class="panel">
      <div class="panel-head">
        <span class="panel-title">Toque para mudar a cor</span>
        <button class="link" id="toToday">ir para hoje</button>
      </div>
      <div class="scroller" id="scroller"><div class="grid" id="grid"></div></div>
      <div id="emptyBox"></div>
      <div class="legend">
        <span><i class="chip" style="background:var(--azul)"></i> concluí</span>
        <span><i class="chip" style="background:var(--verde)"></i> comecei</span>
        <span><i class="chip" style="background:var(--vermelho)"></i> não fiz</span>
        <span><i class="chip" style="background:var(--vazio)"></i> sem registro</span>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head"><span class="panel-title">Meus hábitos</span><span class="panel-title" id="countHabits"></span></div>
      <div id="habitEditor"></div>
      <div id="arquivados"></div>
      <div class="form">
        <input type="text" id="newHabit" placeholder="Hábito" maxlength="28">
        <input type="text" id="newCue" placeholder="depois de…" maxlength="40">
        <button class="btn" id="addBtn">Adicionar</button>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head"><span class="panel-title">Backup dos dados</span></div>
      <div class="dados-box">
        <p class="aviso">Seus registros ficam salvos só neste aparelho, dentro desta conversa. Exporte de vez em quando e guarde o texto em algum lugar seu.</p>
        <div class="dados-row">
          <button class="btn" id="expBtn">Exportar</button>
          <button class="btn ghost" id="impBtn">Importar</button>
        </div>
        <div id="dadosArea"></div>
      </div>

  <section id="view-plano" class="hidden">
    <div class="plano-top">
      <button class="nav" id="pprev" aria-label="Dia anterior">‹</button>
      <div class="label" id="planoLabel">—</div>
      <button class="nav" id="pnext" aria-label="Próximo dia">›</button>
    </div>
    <div id="planoResumo"></div>
    <section class="panel">
      <div class="panel-head">
        <span class="panel-title">Lista do dia</span>
        <button class="link" id="planoHoje">ir para hoje</button>
      </div>
      <div id="tarefas"></div>
      <div class="form">
        <input type="text" id="newTask" placeholder="Qual é o próximo passo?" maxlength="70">
        <button class="btn" id="addTask">Incluir</button>
      </div>
      <div style="padding:0 16px 16px" id="puxarBox"></div>
    </section>
  </section>

  <section id="view-relatorio" class="hidden">
    <div class="monthbar">
      <button class="nav" id="rprev" aria-label="Mês anterior">‹</button>
      <div class="label" id="rmonthLabel">—</div>
      <button class="nav" id="rnext" aria-label="Próximo mês">›</button>

</div>

<nav class="tabs" role="tablist">

    <svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>Mês</button>
  <button class="tab" data-view="plano" role="tab" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M4 6.5h3.5M4 12h3.5M4 17.5h3.5M11 6.5h9M11 12h9M11 17.5h9"/></svg>Plano</button>

<div class="toast" id="toast"></div>

<script>
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DIAS=['D','S','T','Q','Q','S','S'];
const DIAS_LONGO=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const CICLO=['none','done','started','missed'];
const NOME={done:'concluí',started:'comecei',missed:'não fiz',none:'sem registro'};

let data={habits:[],marks:{},reasons:{},tasks:{}};
let planoDia=new Date();
const MOTIVOS=['esqueci','sem tempo','sem vontade'];
const ativos=()=>data.habits.filter(h=>!h.arquivado);
const arquivados=()=>data.habits.filter(h=>h.arquivado);
const hoje=new Date();
let ver=new Date(hoje.getFullYear(),hoje.getMonth(),1);
let viewAtual='hoje';

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const chave=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const diasNoMes=(y,m)=>new Date(y,m+1,0).getDate();
const hojeKey=()=>chave(hoje.getFullYear(),hoje.getMonth(),hoje.getDate());
const escapa=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1700);}
function tocar(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms||12); }catch(e){} }

const KEY='quadro-habitos:v1';
let pend=null;
function salvar(){
  clearTimeout(pend);
  pend=setTimeout(()=>{
    try{ localStorage.setItem(KEY, JSON.stringify(data)); }
    catch(e){ toast('Não deu para salvar agora'); }
  },200);
}
function estado(k,id){return (data.marks[k]&&data.marks[k][id])||'none';}
function motivo(k,id){return (data.reasons[k]&&data.reasons[k][id])||null;}
function setMotivo(k,id,r){
  if(!data.reasons[k])data.reasons[k]={};
  if(!r)delete data.reasons[k][id]; else data.reasons[k][id]=r;
  if(!Object.keys(data.reasons[k]).length)delete data.reasons[k];
  salvar();
}
function setEstado(k,id,s){
  if(!data.marks[k])data.marks[k]={};
  if(s==='none')delete data.marks[k][id]; else data.marks[k][id]=s;
  if(!Object.keys(data.marks[k]).length)delete data.marks[k];
  if(s!=='missed') setMotivo(k,id,null);
  salvar();
}

/* ---------- hoje ---------- */
function sequencia(id){
  let n=0; const d=new Date(hoje);
  if(estado(hojeKey(),id)!=='done') d.setDate(d.getDate()-1);
  while(n<400){
    const k=chave(d.getFullYear(),d.getMonth(),d.getDate());
    if(estado(k,id)==='done'){n++;d.setDate(d.getDate()-1);} else break;
  }
  return n;
}
function pendentesHoje(){
  const k=hojeKey();
  return ativos().filter(h=>estado(k,h.id)==='none').length;
}
function renderDayline(){
  if(!ativos().length){$('dayline').innerHTML='';return;}
  const k=hojeKey();
  const feitos=ativos().filter(h=>estado(k,h.id)==='done').length;
  const p=pendentesHoje();
  const tot=ativos().length;
  let txt;
  if(feitos===tot) txt=`Dia fechado. <b>${feitos} de ${feitos}</b> concluídos — não precisa de mais nada hoje.`;
  else if(p===0) txt=`Tudo registrado. <b>${feitos}</b> concluído${feitos===1?'':'s'} de ${tot}. Registrar o que não deu certo vale tanto quanto marcar azul.`;
  else txt=`Faltam <b>${p}</b> registro${p===1?'':'s'} de hoje. Se estiver sem tempo, faça a versão mínima e marque azul — vale.`;
  $('dayline').innerHTML=`<div class="dayline">${txt}</div>`;
}
function renderMini(){
  if(!ativos().length){$('miniStat').textContent='';return;}
  const y=hoje.getFullYear(),m=hoje.getMonth();
  let done=0,poss=0;
  for(let d=1;d<=hoje.getDate();d++){
    const k=chave(y,m,d);
    ativos().forEach(h=>{poss++; if(estado(k,h.id)==='done')done++;});
  }
  $('miniStat').textContent=`${MESES[m].slice(0,3)} ${poss?Math.round(done/poss*100):0}%`;
}
function renderHoje(){
  $('heroPill').textContent=DIAS_LONGO[hoje.getDay()];
  $('heroTitle').textContent=`${hoje.getDate()} de ${MESES[hoje.getMonth()]}`;
  renderMini(); renderDayline();
  const box=$('todayList');
  if(!ativos().length){ box.innerHTML=emptyHTML(); ligarSeeds(); return; }
  const k=hojeKey();
  box.innerHTML=ativos().map(hb=>{
    const s=estado(k,hb.id), seq=sequencia(hb.id);
    let selo;
    if(seq>1) selo=`${seq} dias seguidos`;
    else if(seq===1) selo='1 dia';
    else selo='sequência zerada';
    const r=motivo(k,hb.id);
    const motivoHTML = s==='missed' ? `<div class="motivo">
        <p class="motivo-l">O que atrapalhou?</p>
        <div class="motivos">${MOTIVOS.map(mm=>
          `<button class="mt" data-m="${mm}" data-h="${hb.id}" aria-pressed="${r===mm}">${mm}</button>`).join('')}</div>
      </div>` : '';
    return `<div class="hcard${s==='done'?' feito':''}">
      <div class="hcard-top">
        <div><p class="hname">${escapa(hb.name)}</p>${hb.cue?`<p class="hcue">${escapa(hb.cue)}</p>`:''}</div>
        <span class="streak ${seq>1?'on':''}">${selo}</span>
      </div>
      <div class="choices">
        ${['done','started','missed'].map(v=>`<button class="ch" data-v="${v}" data-h="${hb.id}" aria-pressed="${s===v}"><i></i>${NOME[v]}</button>`).join('')}
      </div>
      ${motivoHTML}
      ${semanaHTML(hb.id)}
    </div>`;
  }).join('');
  box.querySelectorAll('.ch').forEach(b=>b.addEventListener('click',()=>{
    const atual=estado(hojeKey(),b.dataset.h);
    tocar(atual===b.dataset.v?8:14);
    setEstado(hojeKey(),b.dataset.h, atual===b.dataset.v?'none':b.dataset.v);
    renderHoje();
  }));
  box.querySelectorAll('.mt').forEach(b=>b.addEventListener('click',()=>{
    const atual=motivo(hojeKey(),b.dataset.h);
    tocar(10);
    setMotivo(hojeKey(),b.dataset.h, atual===b.dataset.m?null:b.dataset.m);
    renderHoje();
  }));
}
function semanaHTML(id){
  const base=new Date(hoje); base.setDate(base.getDate()-base.getDay());
  let out='';
  for(let i=0;i<7;i++){
    const d=new Date(base); d.setDate(base.getDate()+i);
    const k=chave(d.getFullYear(),d.getMonth(),d.getDate());
    const agora=d.toDateString()===hoje.toDateString();
    out+=`<div class="ws ${agora?'now':''}"><span>${DIAS[i]}</span><i class="${estado(k,id)}"></i></div>`;
  }
  return `<div class="weekstrip">${out}</div>`;
}
function emptyHTML(){
  return `<div class="panel"><div class="empty"><b>Nenhum hábito ainda</b>
    Comece com dois ou três. Menos do que você acha que aguenta.
    <div class="seeds">
      <button class="seed" data-seed="Estudar código|depois do café da manhã">Estudar código</button>
      <button class="seed" data-seed="Planejar o dia|ao sentar na mesa">Planejar o dia</button>
      <button class="seed" data-seed="Caminhar|depois do almoço">Caminhar</button>
    </div></div>
    <div class="form"><input type="text" id="newHabit2" placeholder="Hábito" maxlength="28">
    <button class="btn" id="addBtn2">Adicionar</button></div></div>`;
}
function ligarSeeds(){
  document.querySelectorAll('.seed').forEach(b=>b.addEventListener('click',()=>{
    const p=b.dataset.seed.split('|'); addHabito(p[0],p[1]);
  }));
  const i=$('newHabit2'), b=$('addBtn2');
  if(b) b.addEventListener('click',()=>addHabito(i.value));
  if(i) i.addEventListener('keydown',e=>{if(e.key==='Enter')addHabito(i.value);});
}

/* ---------- mês ---------- */
function renderMes(){
  const y=ver.getFullYear(),m=ver.getMonth(),total=diasNoMes(y,m);
  $('heroPill').textContent='Registro do mês';
  $('heroTitle').textContent=`${MESES[m]} ${y}`;
  $('monthLabel').textContent=`${MESES[m]} ${y}`;
  renderMini();
  const grid=$('grid');
  grid.style.gridTemplateColumns=`126px repeat(${total},34px)`;
  grid.innerHTML='';
  const corner=document.createElement('div');
  corner.className='corner'; corner.innerHTML='<span class="panel-title">Hábito</span>';
  grid.appendChild(corner);
  for(let d=1;d<=total;d++){
    const wd=new Date(y,m,d).getDay();
    const h=document.createElement('div');
    h.className='dayhead'+((wd===0||wd===6)?' weekend':'')+(ehHoje(y,m,d)?' today':'');
    h.innerHTML=`<span>${DIAS[wd]}</span><b>${d}</b>`;
    if(ehHoje(y,m,d))h.id='todayCol';
    grid.appendChild(h);
  }
  ativos().forEach(hb=>{
    const n=document.createElement('div');
    n.className='cellname'; n.textContent=hb.name; n.title=hb.name;
    grid.appendChild(n);
    for(let d=1;d<=total;d++){
      const wd=new Date(y,m,d).getDay(), k=chave(y,m,d);
      const c=document.createElement('button');
      c.className='cell'+((wd===0||wd===6)?' weekend':'')+(futuro(y,m,d)?' future':'');
      c.dataset.s=estado(k,hb.id);
      c.setAttribute('aria-label',`${hb.name}, dia ${d}: ${NOME[c.dataset.s]}`);
      c.innerHTML='<i class="dot"></i>';
      c.addEventListener('click',()=>{
        const prox=CICLO[(CICLO.indexOf(c.dataset.s)+1)%CICLO.length];
        c.dataset.s=prox; tocar(10);
        c.setAttribute('aria-label',`${hb.name}, dia ${d}: ${NOME[prox]}`);
        setEstado(k,hb.id,prox); renderMini();
      });
      grid.appendChild(c);
    }
  });
  $('emptyBox').innerHTML=ativos().length?'':`<div class="empty"><b>Nenhum hábito ativo</b>Adicione abaixo para a grade aparecer.</div>`;
  renderEditor();
  requestAnimationFrame(irParaHoje);
}
const ehHoje=(y,m,d)=>y===hoje.getFullYear()&&m===hoje.getMonth()&&d===hoje.getDate();
const futuro=(y,m,d)=>new Date(y,m,d)>new Date(hoje.getFullYear(),hoje.getMonth(),hoje.getDate());
function irParaHoje(){const c=$('todayCol'); if(c)$('scroller').scrollLeft=Math.max(0,c.offsetLeft-150);}

function renderEditor(){
  const at=ativos();
  $('countHabits').textContent=at.length?`${at.length}/8`:'';
  $('habitEditor').innerHTML=at.map(h=>`
    <div class="hrow">
      <input class="n1" value="${escapa(h.name)}" data-id="${h.id}" data-f="name" maxlength="28" aria-label="Nome do hábito">
      <input class="n2" value="${escapa(h.cue||'')}" data-id="${h.id}" data-f="cue" maxlength="40" placeholder="depois de…" aria-label="Gatilho">
      <button class="arq-btn" data-id="${h.id}" aria-label="Arquivar ${escapa(h.name)}">arquivar</button>
    </div>`).join('');
  $('habitEditor').querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input',()=>{
      const h=data.habits.find(x=>x.id===inp.dataset.id);
      if(h){ h[inp.dataset.f]=inp.value; salvar(); }
    });
  });
  $('habitEditor').querySelectorAll('.arq-btn').forEach(b=>{
    b.addEventListener('click',()=>{
      const h=data.habits.find(x=>x.id===b.dataset.id);
      if(!h) return;
      h.arquivado=true; tocar(12); salvar(); renderMes();
      toast('Arquivado — o histórico ficou guardado');
    });
  });
  renderArquivados();
}

function renderArquivados(){
  const arq=arquivados();
  if(!arq.length){ $('arquivados').innerHTML=''; return; }
  $('arquivados').innerHTML=`<div class="arq-head"><span>Arquivados</span><span>${arq.length}</span></div>`+
    arq.map(h=>`<div class="arq-row">
      <span>${escapa(h.name)}</span>
      <button class="mini-btn" data-volta="${h.id}">reativar</button>
      <button class="mini-btn perigo" data-apaga="${h.id}">excluir</button>
    </div>`).join('');
  $('arquivados').querySelectorAll('[data-volta]').forEach(b=>{
    b.addEventListener('click',()=>{
      if(ativos().length>=8){toast('Oito ativos já é muita coisa');return;}
      const h=data.habits.find(x=>x.id===b.dataset.volta);
      if(h){ delete h.arquivado; tocar(12); salvar(); renderMes(); toast('Voltou para a lista'); }
    });
  });
  $('arquivados').querySelectorAll('[data-apaga]').forEach(b=>{
    b.addEventListener('click',()=>{
      const h=data.habits.find(x=>x.id===b.dataset.apaga);
      if(!h) return;
      if(!b.classList.contains('armado')){
        $('arquivados').querySelectorAll('[data-apaga]').forEach(o=>{o.classList.remove('armado');o.textContent='excluir';clearTimeout(o._t);});
        b.classList.add('armado'); b.textContent='apagar tudo?';
        toast('Isso apaga o histórico. Toque de novo.');
        b._t=setTimeout(()=>{b.classList.remove('armado');b.textContent='excluir';},4000);
        return;
      }
      clearTimeout(b._t);
      data.habits=data.habits.filter(x=>x.id!==h.id);
      [data.marks,data.reasons].forEach(mapa=>{
        Object.keys(mapa).forEach(k=>{
          delete mapa[k][h.id];
          if(!Object.keys(mapa[k]).length)delete mapa[k];
        });
      });
      salvar(); renderMes(); toast('Excluído de vez');
    });
  });
}
function addHabito(nome,cue){
  nome=(nome||'').trim(); if(!nome)return;
  if(ativos().length>=8){toast('Oito já é muita coisa');return;}
  data.habits.push({id:'h'+Date.now()+Math.floor(Math.random()*99),name:nome,cue:(cue||'').trim()});
  if($('newHabit'))$('newHabit').value='';
  if($('newCue'))$('newCue').value='';
  salvar();
  if(viewAtual==='mes')renderMes(); else renderHoje();
}

/* ---------- relatório ---------- */
function habitosDoMes(){
  const y=ver.getFullYear(),m=ver.getMonth(),total=diasNoMes(y,m);
  const temMarca=id=>{
    for(let d=1;d<=total;d++){ if(estado(chave(y,m,d),id)!=='none') return true; }
    return false;
  };
  return data.habits.filter(h=>!h.arquivado || temMarca(h.id));
}
function analisar(){
  const y=ver.getFullYear(),m=ver.getMonth(),total=diasNoMes(y,m);
  const ultimo=(y===hoje.getFullYear()&&m===hoje.getMonth())?hoje.getDate():total;
  const decorridos=(new Date(y,m,1)>hoje)?0:ultimo;
  return habitosDoMes().map(hb=>{
    const seq=[]; let done=0,started=0,missed=0,vazio=0,melhor=0,corr=0,sv=0,melhorSV=0,pares=0,anterior=null;
    const wdias=Array.from({length:7},()=>({done:0,reg:0}));
    const mots={}; MOTIVOS.forEach(x=>mots[x]=0);
    let semMotivo=0;
    for(let d=1;d<=total;d++){
      const k=chave(y,m,d), s=estado(k,hb.id), wd=new Date(y,m,d).getDay();
      seq.push({s,wd,futuro:futuro(y,m,d)});
      if(d>decorridos)continue;
      if(s==='done'){done++;corr++;melhor=Math.max(melhor,corr);}
      else{corr=0; if(s==='started')started++; else if(s==='missed')missed++; else vazio++;}
      if(s==='missed'){
        sv=0; if(anterior==='missed')pares++;
        const r=motivo(k,hb.id);
        if(r&&mots[r]!==undefined)mots[r]++; else semMotivo++;
      } else { sv++; melhorSV=Math.max(melhorSV,sv); }
      anterior=s;
      if(s!=='none'){wdias[wd].reg++; if(s==='done')wdias[wd].done++;}
    }
    const aprov=decorridos?Math.round(done/decorridos*100):0;
    let pior=null,piorTaxa=1.1;
    wdias.forEach((v,i)=>{if(v.reg>=2){const t=v.done/v.reg; if(t<piorTaxa){piorTaxa=t;pior=i;}}});
    let motTop=null;
    MOTIVOS.forEach(x=>{ if(mots[x]>0 && (!motTop||mots[x]>mots[motTop])) motTop=x; });
    return {hb,seq,done,started,missed,vazio,aprov,melhor,melhorSV,pior,piorTaxa,pares,mots,motTop,semMotivo,decorridos};
  });
}
function fita(seq){
  let h=''; seq.forEach((c,i)=>{ if(i>0&&c.wd===0)h+='<i class="rb gap"></i>'; h+=`<i class="rb ${c.futuro?'':c.s}"></i>`; });
  return `<div class="ribbon">${h}</div>`;
}
function renderRelatorio(){
  const y=ver.getFullYear(),m=ver.getMonth();
  $('heroPill').textContent='Fechamento';
  $('heroTitle').textContent=`${MESES[m]} ${y}`;
  $('rmonthLabel').textContent=`${MESES[m]} ${y}`;
  renderMini();
  if(!habitosDoMes().length){$('report').innerHTML=`<div class="panel"><div class="empty"><b>Sem dados ainda</b>Adicione um hábito e comece a marcar.</div></div>`;return;}
  const an=analisar();
  const melhor=an.slice().sort((a,b)=>b.aprov-a.aprov)[0];
  const pior=an.slice().sort((a,b)=>a.aprov-b.aprov)[0];
  const td=an.reduce((s,a)=>s+a.done,0), tp=an.reduce((s,a)=>s+a.decorridos,0);
  const geral=tp?Math.round(td/tp*100):0;

  const gm={}; MOTIVOS.forEach(x=>gm[x]=0);
  an.forEach(a=>MOTIVOS.forEach(x=>gm[x]+=a.mots[x]));
  const totMot=MOTIVOS.reduce((s,x)=>s+gm[x],0);
  let linhaMotivo='';
  if(totMot>=3){
    const top=MOTIVOS.slice().sort((a,b)=>gm[b]-gm[a])[0];
    const pct=Math.round(gm[top]/totMot*100);
    const conselho={
      'esqueci':'Isso é falha de lembrete, não de disciplina. Um alarme fixo no horário do gatilho resolve mais que qualquer esforço.',
      'sem tempo':'A versão mínima está grande demais. Corte pela metade e veja se o número muda.',
      'sem vontade':'Vontade some mesmo. Amarre o hábito a um horário fixo para não depender dela.'
    }[top];
    linhaMotivo=`<p><b>${pct}%</b> das falhas foram "${top}". ${conselho}</p>`;
  }
  let veredito;
  if(geral>=70)veredito='O sistema está de pé. Antes de adicionar hábito novo, segure mais um mês nesse ritmo.';
  else if(geral>=40)veredito='Está pegando, com furos. Olhe a fita: os vermelhos costumam vir em pares — é aí que a corrente quebra.';
  else if(geral>0)veredito='A meta está grande demais para a rotina de agora. Corte a versão mínima pela metade antes de tentar de novo.';
  else veredito='Mês ainda sem registro. Marcar o quadrinho é o primeiro hábito.';

  let html=`<div class="summary">
    <div class="sub">Relatório do mês</div>
    <h2>${MESES[m]} de ${y}</h2>
    <p style="margin-top:12px">Aproveitamento geral: <b>${geral}%</b> dos dias possíveis concluídos, somando ${an.length} hábito${an.length>1?'s':''}.</p>
    ${an.length>1?`<p>Mais firme: <b>${escapa(melhor.hb.name)}</b> (${melhor.aprov}%). Precisa de atenção: <b>${escapa(pior.hb.name)}</b> (${pior.aprov}%).</p>`:''}
    ${linhaMotivo}
    <p>${veredito}</p></div>`;

  an.forEach(a=>{
    const n=[`Maior sequência de dias concluídos: <b>${a.melhor}</b>.`];
    if(a.melhorSV>a.melhor)n.push(`Maior período sem nenhum vermelho: <b>${a.melhorSV} dias</b>.`);
    if(a.pior!==null)n.push(`Dia mais difícil: <b>${DIAS_LONGO[a.pior]}</b> (${Math.round(a.piorTaxa*100)}% de conclusão).`);
    if(a.pares>0)n.push(`Falhou dois dias seguidos <b>${a.pares}×</b>. É o padrão que derruba o hábito — depois de um vermelho, o dia seguinte é o que importa.`);
    if(a.started>=3)n.push(`Começou e não terminou <b>${a.started}×</b> — sinal de que a tarefa está maior que o tempo que sobra.`);
    if(a.vazio>=5)n.push(`<b>${a.vazio} dias</b> sem registro. Sem marcação não dá para saber o que aconteceu.`);
    const detMot=MOTIVOS.filter(x=>a.mots[x]>0).map(x=>`${x} ${a.mots[x]}×`).join(' · ');
    if(detMot)n.push(`Motivos das falhas: <b>${detMot}</b>${a.semMotivo?` · sem motivo anotado ${a.semMotivo}×`:''}.`);
    html+=`<div class="rcard"><p class="rname">${escapa(a.hb.name)}${a.hb.arquivado?' <span style="font-size:12px;font-weight:800;color:var(--cinza)">(arquivado)</span>':''}</p>${fita(a.seq)}
      <div class="stats">
        <div class="st a"><div class="n">${a.done}</div><div class="l">concluí</div></div>
        <div class="st v"><div class="n">${a.started}</div><div class="l">comecei</div></div>
        <div class="st r"><div class="n">${a.missed}</div><div class="l">não fiz</div></div>
        <div class="st p"><div class="n">${a.aprov}%</div><div class="l">aproveit.</div></div>
      </div><p class="rnote">${n.join('<br>')}</p></div>`;
  });
  html+=`<button class="btn ghost wide" id="copyBtn">Copiar relatório em texto</button>`;
  $('report').innerHTML=html;
  $('copyBtn').addEventListener('click',()=>copiar(an,geral));
}
function copiar(an,geral){
  const y=ver.getFullYear(),m=ver.getMonth();
  let t=`RELATÓRIO — ${MESES[m].toUpperCase()} ${y}\nAproveitamento geral: ${geral}%\n\n`;
  an.forEach(a=>{
    t+=`${a.hb.name}\n  concluí ${a.done} · comecei ${a.started} · não fiz ${a.missed} · sem registro ${a.vazio}\n`;
    t+=`  aproveitamento ${a.aprov}% · maior sequência ${a.melhor} dias\n`;
    if(a.pior!==null)t+=`  dia mais difícil: ${DIAS_LONGO[a.pior]}\n`;
    t+='\n';
  });
  const alternativa=()=>copiarTexto(t,'Relatório copiado','Não deu para copiar');
  alternativa();
}

/* ---------- planejamento ---------- */
const planoKey=()=>chave(planoDia.getFullYear(),planoDia.getMonth(),planoDia.getDate());
const tarefasDe=k=>data.tasks[k]||[];
function salvarTarefas(k,lista){
  if(lista.length) data.tasks[k]=lista; else delete data.tasks[k];
  salvar();
}
function rotuloDia(d){
  const zerar=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime();
  const dif=Math.round((zerar(d)-zerar(hoje))/86400000);
  if(dif===0) return 'hoje';
  if(dif===1) return 'amanhã';
  if(dif===-1) return 'ontem';
  return `${DIAS_LONGO[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()].slice(0,3)}`;
}
function renderPlano(){
  const k=planoKey();
  const lista=tarefasDe(k);
  $('heroPill').textContent='Planejamento';
  $('heroTitle').textContent=`${planoDia.getDate()} de ${MESES[planoDia.getMonth()]}`;
  $('planoLabel').textContent=rotuloDia(planoDia);
  renderMini();

  const feitas=lista.filter(t=>t.feito).length;
  if(lista.length){
    const pct=Math.round(feitas/lista.length*100);
    let txt;
    if(feitas===lista.length) txt=`Lista zerada. <b>${lista.length}</b> de ${lista.length} — pode fechar o dia.`;
    else if(lista.length>7) txt=`<b>${lista.length} itens</b> é lista de semana, não de dia. Escolha os três que importam e empurre o resto para amanhã.`;
    else txt=`<b>${feitas} de ${lista.length}</b> concluídas. Comece pela que estiver mais fácil de começar, não pela mais importante.`;
    $('planoResumo').innerHTML=`<div class="plano-resumo">${txt}<div class="barra" style="margin-top:12px;margin-bottom:0"><i style="width:${pct}%"></i></div></div>`;
  } else {
    $('planoResumo').innerHTML=`<div class="plano-resumo">Nada escrito para ${rotuloDia(planoDia)}. Tirar as tarefas da cabeça e pôr aqui já libera espaço mental.</div>`;
  }

  $('tarefas').innerHTML = lista.length ? lista.map(t=>`
    <div class="tarefa${t.feito?' ok':''}" data-id="${t.id}">
      <button class="tcheck" data-tog="${t.id}" aria-label="Marcar ${escapa(t.txt)}" aria-pressed="${!!t.feito}">
        <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
      </button>
      <div class="ttxt">${escapa(t.txt)}</div>
      <button class="tdel" data-del="${t.id}" aria-label="Apagar tarefa">✕</button>
    </div>`).join('')
    : `<div class="empty"><b>Lista vazia</b>Escreva o próximo passo concreto: não "fazer a landing page", mas "criar o arquivo index.html".</div>`;

  $('tarefas').querySelectorAll('[data-tog]').forEach(b=>b.addEventListener('click',()=>{
    const l=tarefasDe(k).slice();
    const t=l.find(x=>x.id===b.dataset.tog);
    if(!t)return;
    t.feito=!t.feito; tocar(t.feito?14:8);
    salvarTarefas(k,l); renderPlano();
  }));
  $('tarefas').querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{
    salvarTarefas(k, tarefasDe(k).filter(x=>x.id!==b.dataset.del));
    tocar(8); renderPlano();
  }));

  // pendências do dia anterior
  const ant=new Date(planoDia); ant.setDate(ant.getDate()-1);
  const kAnt=chave(ant.getFullYear(),ant.getMonth(),ant.getDate());
  const pend=tarefasDe(kAnt).filter(t=>!t.feito);
  $('puxarBox').innerHTML = pend.length
    ? `<button class="puxar" id="puxarBtn">Trazer ${pend.length} pendência${pend.length>1?'s':''} de ${rotuloDia(ant)}</button>` : '';
  if(pend.length) $('puxarBtn').addEventListener('click',()=>{
    const l=tarefasDe(k).slice();
    pend.forEach(t=>l.push({id:'t'+Date.now()+Math.floor(Math.random()*999),txt:t.txt,feito:false}));
    salvarTarefas(k,l);
    salvarTarefas(kAnt, tarefasDe(kAnt).filter(t=>t.feito));
    tocar(14); renderPlano(); toast('Pendências trazidas');
  });
}
function addTarefa(txt){
  txt=(txt||'').trim(); if(!txt)return;
  const k=planoKey();
  const l=tarefasDe(k).slice();
  l.push({id:'t'+Date.now()+Math.floor(Math.random()*999),txt,feito:false});
  salvarTarefas(k,l);
  $('newTask').value='';
  tocar(10); renderPlano();
}

/* ---------- backup ---------- */
function copiarTexto(t,ok,falhou){
  const alternativa=()=>{
    try{
      const ta=document.createElement('textarea');
      ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      const r=document.execCommand('copy');
      document.body.removeChild(ta);
      toast(r?ok:falhou);
    }catch(e){ toast(falhou); }
  };
  if(navigator.clipboard&&window.isSecureContext)
    navigator.clipboard.writeText(t).then(()=>toast(ok)).catch(alternativa);
  else alternativa();
}
function abrirExportar(){
  const json=JSON.stringify({v:2,exportado:new Date().toISOString(),habits:data.habits,marks:data.marks,reasons:data.reasons,tasks:data.tasks});
  $('dadosArea').innerHTML=`
    <p class="aviso" style="margin:10px 0 8px">Copie este texto e guarde num bloco de notas, e-mail ou arquivo. É o seu backup completo.</p>
    <textarea class="dados-txt" id="expTxt" readonly>${escapa(json)}</textarea>
    <div class="dados-row" style="margin-top:8px">
      <button class="btn" id="copyJson">Copiar</button>
      <button class="btn ghost" id="baixaJson">Baixar arquivo</button>
    </div>`;
  $('expTxt').addEventListener('focus',e=>e.target.select());
  $('copyJson').addEventListener('click',()=>copiarTexto(json,'Backup copiado','Selecione o texto e copie na mão'));
  $('baixaJson').addEventListener('click',()=>{
    try{
      const b=new Blob([json],{type:'application/json'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(b);
      a.download=`habitos-${chave(hoje.getFullYear(),hoje.getMonth(),hoje.getDate())}.json`;
      document.body.appendChild(a); a.click();
      setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
      toast('Arquivo gerado');
    }catch(e){ toast('Baixar não funciona aqui — use Copiar'); }
  });
}
function abrirImportar(){
  $('dadosArea').innerHTML=`
    <p class="aviso" style="margin:10px 0 8px">Cole aqui um backup exportado antes. Isso substitui tudo que está no app hoje.</p>
    <textarea class="dados-txt" id="impTxt" placeholder="Cole o texto do backup"></textarea>
    <div class="dados-row" style="margin-top:8px">
      <button class="btn" id="restaurar">Restaurar</button>
      <button class="btn ghost" id="cancelaImp">Cancelar</button>
    </div>`;
  $('cancelaImp').addEventListener('click',()=>{$('dadosArea').innerHTML='';});
  const b=$('restaurar');
  b.addEventListener('click',()=>{
    let p;
    try{ p=JSON.parse($('impTxt').value.trim()); }
    catch(e){ toast('Texto inválido — cole o backup inteiro'); return; }
    if(!p||!Array.isArray(p.habits)){ toast('Esse texto não parece um backup'); return; }
    if(!b.classList.contains('armado')){
      b.classList.add('armado'); b.textContent='Substituir tudo?';
      b.style.background='var(--vermelho)';
      toast('Toque de novo para confirmar');
      b._t=setTimeout(()=>{b.classList.remove('armado');b.textContent='Restaurar';b.style.background='';},4000);
      return;
    }
    clearTimeout(b._t);
    data.habits=p.habits||[];
    data.marks=p.marks||{};
    data.reasons=p.reasons||{};
    data.tasks=p.tasks||{};
    data.habits.forEach(h=>{if(h.cue===undefined)h.cue='';});
    salvar(); $('dadosArea').innerHTML=''; renderMes();
    toast(`Restaurado: ${data.habits.length} hábito${data.habits.length===1?'':'s'}`);
  });
}

/* ---------- navegação ---------- */
function irPara(v){
  viewAtual=v;
  ['hoje','mes','plano','relatorio'].forEach(x=>$('view-'+x).classList.toggle('hidden',x!==v));
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.view===v));
  if(v==='hoje')renderHoje();
  else if(v==='mes')renderMes();
  else if(v==='plano')renderPlano();
  else renderRelatorio();
  window.scrollTo(0,0);
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>irPara(t.dataset.view)));
$('prev').addEventListener('click',()=>{ver.setMonth(ver.getMonth()-1);renderMes();});
$('next').addEventListener('click',()=>{ver.setMonth(ver.getMonth()+1);renderMes();});
$('rprev').addEventListener('click',()=>{ver.setMonth(ver.getMonth()-1);renderRelatorio();});
$('rnext').addEventListener('click',()=>{ver.setMonth(ver.getMonth()+1);renderRelatorio();});
$('toToday').addEventListener('click',()=>{ver=new Date(hoje.getFullYear(),hoje.getMonth(),1);renderMes();});
$('addBtn').addEventListener('click',()=>addHabito($('newHabit').value,$('newCue').value));
$('newHabit').addEventListener('keydown',e=>{if(e.key==='Enter')addHabito($('newHabit').value,$('newCue').value);});
$('newCue').addEventListener('keydown',e=>{if(e.key==='Enter')addHabito($('newHabit').value,$('newCue').value);});
$('expBtn').addEventListener('click',abrirExportar);
$('impBtn').addEventListener('click',abrirImportar);
$('pprev').addEventListener('click',()=>{planoDia.setDate(planoDia.getDate()-1);renderPlano();});
$('pnext').addEventListener('click',()=>{planoDia.setDate(planoDia.getDate()+1);renderPlano();});
$('planoHoje').addEventListener('click',()=>{planoDia=new Date(hoje);renderPlano();});
$('addTask').addEventListener('click',()=>addTarefa($('newTask').value));
$('newTask').addEventListener('keydown',e=>{if(e.key==='Enter')addTarefa($('newTask').value);});

/* ---------- início ---------- */
(function(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){
      const p=JSON.parse(raw);
      data.habits=p.habits||[]; data.marks=p.marks||{}; data.reasons=p.reasons||{}; data.tasks=p.tasks||{};
    }
  }catch(e){}
  data.habits.forEach(h=>{if(h.cue===undefined)h.cue='';});
  irPara('hoje');
})();
</script>
